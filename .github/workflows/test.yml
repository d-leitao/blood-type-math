name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model tests
        run: npm test
      - name: data/prevalence.csv matches data/source.csv
        run: |
          python3 data/build.py
          git diff --exit-code data/prevalence.csv
